h1{font-family:var(--display);font-weight:800;font-size:2.4rem;margin:0;line-height:1}

button{font:inherit;cursor:pointer;color:inherit}

.card{perspective:900px;height:230px;max-width:440px;margin:0 auto;cursor:pointer}
.card-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center}
.front{background:var(--accent);color:#fff}
.back{background:var(--red);color:#fff;transform:rotateY(180deg)}
.big{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1.1;text-wrap:balance}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tile.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 15%,var(--panel))}

.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--panel))}

.msg{text-align:center;font-family:var(--display);font-size:1.3rem;min-height:2rem;margin-top:12px}

const MODES={kart:"🃏 Kartlar",esle:"🔗 Eşleştir",quiz:"❓ Quiz",dinle:"🔊 Dinle & Seç"};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let subj=store.get("ev-subj","fr");if(!SUBJECTS[subj])subj="fr";
let topic=Object.keys(SUBJECTS[subj].topics)[0],mode="kart",stars=store.get("ev-stars",0);
const $=s=>document.querySelector(s),panel=$("#panel");
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const S=()=>SUBJECTS[subj];
const T=()=>S().topics[topic];
const words=()=>{let t=T();if(t.w)t=t.w;return typeof t=="function"?t():t};
function addStar(k){k*=LV().mult;stars+=k;$("#stars").textContent="⭐ "+stars;store.set("ev-stars",stars)}
function speak(t,rate=.85){const lang=S().lang;if(!lang)return;try{const u=new SpeechSynthesisUtterance(t.replace("…",""));u.lang=lang;u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").startsWith(lang.slice(0,2)));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
$("#stars").textContent="⭐ "+stars;

function nav(){
  const s=S();document.documentElement.style.setProperty("--accent",s.color);$("#sub").textContent=s.title;
  if(!s.lang&&mode=="dinle")mode="quiz";
  $("#subjects").innerHTML=Object.entries(SUBJECTS).map(([k,x])=>`<button class="subj" style="--c:${x.color}" aria-pressed="${k==subj}" data-s="${k}"><b>${x.icon}</b>${x.name}</button>`).join("");
  $("#topics").innerHTML=Object.keys(s.topics).map((k,j)=>`<button class="topic" aria-pressed="${k==topic}" data-t="${k}"><i>${j+1}</i>${k}</button>`).join("");
  $("#levels").innerHTML=LEVELS.map((l,j)=>`<button class="lvl" style="--c:${l.color}" aria-pressed="${j==lv}" data-l="${j}">${l.name}<small>${l.info}</small></button>`).join("");
  $("#modes").innerHTML=Object.entries(MODES).filter(([k])=>k!="dinle"||s.lang).map(([k,m])=>`<button class="mode" aria-pressed="${k==mode}" data-m="${k}">${m}</button>`).join("");
}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-s]"),t=e.target.closest("[data-t]"),m=e.target.closest("[data-m]");
  if(s){subj=s.dataset.s;store.set("ev-subj",subj);topic=Object.keys(S().topics)[0];nav();run()}
  if(t){topic=t.dataset.t;nav();run()} if(m){mode=m.dataset.m;nav();run()}
  const l=e.target.closest("[data-l]");if(l){lv=+l.dataset.l;store.set("ev-lv",lv);nav();run()}
});
function run(){clearInterval(timer);({kart,esle,quiz,dinle:()=>quiz(true)})[mode]()}
const speakBtns=(id="")=>S().lang?`<button class="btn" id="sp">🔊 Dinle</button><button class="btn" id="slow">🐢 Yavaş</button>`:"";

function kart(){
  let W=shuffle(words()),i=0;
  const draw=()=>{const [f,say,b]=W[i];
    panel.innerHTML=`<div class="card" id="card"><div class="card-in">
      <div class="face front"><div class="big">${f}</div>${say&&lv<2?`<div class="say">🗣️ ${say}</div>`:""}<div class="say">çevirmek için dokun</div></div>
      <div class="face back"><div class="big">${b}</div><div class="say">${f}</div></div></div></div>
      <div class="ctrl"><button class="btn alt" id="prev">◀ Önceki</button>${speakBtns()}<button class="btn alt" id="next">Sonraki ▶</button></div>
      <div class="count">${i+1} / ${W.length} · <button class="btn alt" id="mix">🔀 Karıştır</button></div>`;
    $("#mix").onclick=()=>{W=shuffle(W);i=0;draw()};
    $("#card").onclick=()=>$("#card").classList.toggle("flip");
    if(S().lang){$("#sp").onclick=()=>speak(f);$("#slow").onclick=()=>speak(f,.45)}
    $("#prev").onclick=()=>{i=(i-1+W.length)%W.length;draw()};
    $("#next").onclick=()=>{i=(i+1)%W.length;draw()};
  };draw();
}

function esle(){
  const W=shuffle(words()).slice(0,LV().pairs);let sel=null,left=W.length,miss=0;
  const L=shuffle(W.map((w,i)=>[w[0],i])),R=shuffle(W.map((w,i)=>[w[2],i]));
  panel.innerHTML=`<p class="hint">Soldan birini seç, sağda eşini bul!</p>
    <div class="cols"><div>${L.map(([t,i])=>`<button class="tile" data-side="L" data-i="${i}">${t}</button>`).join("")}</div>
    <div>${R.map(([t,i])=>`<button class="tile" data-side="R" data-i="${i}">${t}</button>`).join("")}</div></div><div class="msg" id="msg"></div>`;
  panel.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(b.dataset.side=="L")speak(W[b.dataset.i][0]);
    if(!sel||sel.dataset.side==b.dataset.side){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
    if(sel.dataset.i==b.dataset.i){sel.classList.replace("sel","done");b.classList.add("done");left--;
      $("#msg").textContent=["Süper! 👏","Harika! 🎉","Bravo! 🔥","Efsane! ⚡"][left%4];
      if(!left){const s=miss==0?3:miss<3?2:1;addStar(s);$("#msg").innerHTML=`Hepsini buldun! +${"⭐".repeat(s)}<br><button class="btn" id="again">Tekrar oyna</button>`;$("#again").onclick=esle}}
    else{miss++;[sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),400)});$("#msg").textContent="Hmm, olmadı! Tekrar dene 🤔"}
    sel=null;
  });
}

function quiz(listen=false){
  clearInterval(timer);
  const W=words(),Q=shuffle(W).slice(0,Math.min(LV().q,W.length));let n=0,score=0;const s=S(),labels=T().ask||s.ask;
  const ask=()=>{
    if(n==Q.length){const st=score==Q.length?3:score>=Q.length*.6?2:score>0?1:0;addStar(st);
      panel.innerHTML=`<div class="end"><div class="big">${score} / ${Q.length}</div><div class="msg">${st==3?"Mükemmel! 🏆":st==2?"Çok iyi! 🎉":"Pratik yapalım, sen yaparsın! 💪"}</div><div>+${"⭐".repeat(st)||"0"}</div><button class="btn" id="again">Tekrar oyna</button></div>`;
      $("#again").onclick=()=>quiz(listen);return}
    const w=Q[n],dir=listen?"listen":(s.oneway||Math.random()<.5)?"f":"b",key=dir=="b"?0:2;
    const opts=shuffle([w,...shuffle(W.filter(x=>x!==w&&x[key]!==w[key])).slice(0,LV().opts-1)]);
    panel.innerHTML=`<div class="bar"><b style="width:${n/Q.length*100}%"></b></div>${LV().time?`<div class="timer" id="tm">⏱️ ${LV().time}</div>`:""}
      ${dir=="listen"?`<div class="ctrl" style="margin:0 0 10px"><button class="btn big-btn" id="sp">🔊 Tekrar dinle</button><button class="btn alt big-btn" id="slow">🐢 Yavaş dinle</button></div><p class="hint">Dinle! Ne dedi? İstediğin kadar tekrar dinleyebilirsin.</p>`
        :`<div class="q">${dir=="f"?w[0]:w[2]}</div><p class="hint">${dir=="f"?labels[0]:labels[1]}</p>`}
      <div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o===w}">${o[key]}</button>`).join("")}</div><div class="msg" id="msg"></div>`;
    if(dir=="listen"){$("#sp").onclick=()=>speak(w[0]);$("#slow").onclick=()=>speak(w[0],.45);setTimeout(()=>speak(w[0]),250)}
    const answer=b=>{clearInterval(timer);
      panel.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok=="true")x.classList.add("right")});
      if(!b)$("#msg").textContent="Süre bitti! ⏰ "+w[0]+" = "+w[2];
      else if(b.dataset.ok=="true"){score++;$("#msg").textContent="Doğru! ✅ "+w[0]+" = "+w[2]}
      else{b.classList.add("wrong");$("#msg").textContent="Yanlış ❌ "+w[0]+" = "+w[2]}
      speak(w[0]);n++;timer=setTimeout(ask,1600);
    };
    panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
    if(LV().time){let left=LV().time;timer=setInterval(()=>{left--;const tm=$("#tm");if(tm)tm.textContent="⏱️ "+left;if(left<=0)answer(null)},1000)}
  };ask();
}
nav();run();
</script>
