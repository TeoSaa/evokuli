<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap">
<style>
/* Layout: school-bag header tinted by the current subject, subject tabs, topic chips, activity panel */
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#172033; --muted:#5d6880;
  --gold:#f2b705; --red:#e2374b; --blue:#2453c9; --ok:#1f9d55; --purple:#7b3fd1; --teal:#0f8a8a; --line:#d6dce8;
  --accent:var(--blue);
  --display:"Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --panel:#182032; --ink:#e8edf7; --muted:#9aa6bf; --gold:#ffc928; --red:#ff5a6c; --blue:#6f95ff; --ok:#3fcf7f; --purple:#a77bff; --teal:#3cc7c7; --line:#283350; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --panel:#182032; --ink:#e8edf7; --muted:#9aa6bf; --gold:#ffc928; --red:#ff5a6c; --blue:#6f95ff; --ok:#3fcf7f; --purple:#a77bff; --teal:#3cc7c7; --line:#283350; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{background:var(--accent);color:#fff;border-radius:18px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:3px solid var(--gold);transition:background .3s}
h1{font-family:var(--display);font-weight:800;font-size:2.4rem;margin:0;line-height:1}
h1 span{color:var(--gold)}
header p{margin:4px 0 0;font-size:1rem;font-weight:700;opacity:.92}
.stars{font-family:var(--display);font-size:1.5rem;background:rgba(0,0,0,.25);padding:6px 14px;border-radius:999px;white-space:nowrap}
.label{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.subj{border:none;border-radius:16px;padding:12px 8px;background:var(--panel);border-bottom:5px solid var(--c);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.subj b{font-size:1.8rem;line-height:1}
.subj[aria-pressed="true"]{background:var(--c);color:#fff}
.topic{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 15px;font-weight:700;display:flex;align-items:center;gap:8px}
.topic i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent);font-family:var(--display);font-size:.85rem}
.topic[aria-pressed="true"]{border-color:var(--ink)}
.mode{flex:1 1 150px;border:none;border-radius:14px;padding:12px;background:var(--panel);border-bottom:4px solid var(--line);font-weight:700}
.mode[aria-pressed="true"]{background:var(--gold);color:#172033;border-bottom-color:#b88900}
.panel{background:var(--panel);border-radius:20px;padding:22px;min-height:340px;border:2px solid var(--line)}
.card{perspective:900px;height:230px;max-width:440px;margin:0 auto;cursor:pointer}
.card-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center}
.front{background:var(--accent);color:#fff}
.back{background:var(--red);color:#fff;transform:rotateY(180deg)}
.big{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1.1;text-wrap:balance}
.say{font-size:.95rem;opacity:.9}
.ctrl{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--accent);color:#fff}
.btn.alt{background:var(--line);color:var(--ink)}
.big-btn{font-size:1.15rem;padding:14px 22px}
.count{text-align:center;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:700;text-align:center}
.tile.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 15%,var(--panel))}
.tile.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--panel));opacity:.6;pointer-events:none}
.tile.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{font-family:var(--display);font-size:1.8rem;text-align:center;margin:6px 0 4px;text-wrap:balance}
.hint{text-align:center;color:var(--muted);margin:0 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;font-weight:700;font-size:1.05rem}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--panel))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 20%,var(--panel))}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar b{display:block;height:100%;background:var(--gold);transition:width .3s}
.msg{text-align:center;font-family:var(--display);font-size:1.3rem;min-height:2rem;margin-top:12px}
.end{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:30px}
@media (max-width:480px){h1{font-size:2rem}.opts{grid-template-columns:1fr}.big{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){.card-in,header{transition:none}.tile.bad{animation:none}}
</style>

const MODES={kart:"🃏 Kartlar",esle:"🔗 Eşleştir",quiz:"❓ Quiz",dinle:"🔊 Dinle & Seç"};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let subj=store.get("ev-subj","fr");if(!SUBJECTS[subj])subj="fr";
let topic=Object.keys(SUBJECTS[subj].topics)[0],mode="kart",stars=store.get("ev-stars",0);
const $=s=>document.querySelector(s),panel=$("#panel");
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const S=()=>SUBJECTS[subj];
const words=()=>{const t=S().topics[topic];return typeof t=="function"?t():t};
function addStar(k){stars+=k;$("#stars").textContent="⭐ "+stars;store.set("ev-stars",stars)}
function speak(t,rate=.85){const lang=S().lang;if(!lang)return;try{const u=new SpeechSynthesisUtterance(t.replace("…",""));u.lang=lang;u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").startsWith(lang.slice(0,2)));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
$("#stars").textContent="⭐ "+stars;

function nav(){
  const s=S();document.documentElement.style.setProperty("--accent",s.color);$("#sub").textContent=s.title;
  if(!s.lang&&mode=="dinle")mode="quiz";
  $("#subjects").innerHTML=Object.entries(SUBJECTS).map(([k,x])=>`<button class="subj" style="--c:${x.color}" aria-pressed="${k==subj}" data-s="${k}"><b>${x.icon}</b>${x.name}</button>`).join("");
  $("#topics").innerHTML=Object.keys(s.topics).map((k,j)=>`<button class="topic" aria-pressed="${k==topic}" data-t="${k}"><i>${j+1}</i>${k}</button>`).join("");
  $("#modes").innerHTML=Object.entries(MODES).filter(([k])=>k!="dinle"||s.lang).map(([k,m])=>`<button class="mode" aria-pressed="${k==mode}" data-m="${k}">${m}</button>`).join("");
}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-s]"),t=e.target.closest("[data-t]"),m=e.target.closest("[data-m]");
  if(s){subj=s.dataset.s;store.set("ev-subj",subj);topic=Object.keys(S().topics)[0];nav();run()}
  if(t){topic=t.dataset.t;nav();run()} if(m){mode=m.dataset.m;nav();run()}
});
function run(){({kart,esle,quiz,dinle:()=>quiz(true)})[mode]()}
const speakBtns=(id="")=>S().lang?`<button class="btn" id="sp">🔊 Dinle</button><button class="btn" id="slow">🐢 Yavaş</button>`:"";

function kart(){
  const W=words();let i=0;
  const draw=()=>{const [f,say,b]=W[i];
    panel.innerHTML=`<div class="card" id="card"><div class="card-in">
      <div class="face front"><div class="big">${f}</div>${say?`<div class="say">🗣️ ${say}</div>`:""}<div class="say">çevirmek için dokun</div></div>
      <div class="face back"><div class="big">${b}</div><div class="say">${f}</div></div></div></div>
      <div class="ctrl"><button class="btn alt" id="prev">◀ Önceki</button>${speakBtns()}<button class="btn alt" id="next">Sonraki ▶</button></div>
      <div class="count">${i+1} / ${W.length}</div>`;
    $("#card").onclick=()=>$("#card").classList.toggle("flip");
    if(S().lang){$("#sp").onclick=()=>speak(f);$("#slow").onclick=()=>speak(f,.45)}
    $("#prev").onclick=()=>{i=(i-1+W.length)%W.length;draw()};
    $("#next").onclick=()=>{i=(i+1)%W.length;draw()};
  };draw();
}

function esle(){
  const W=shuffle(words()).slice(0,6);let sel=null,left=W.length,miss=0;
  const L=shuffle(W.map((w,i)=>[w[0],i])),R=shuffle(W.map((w,i)=>[w[2],i]));
  panel.innerHTML=`<p class="hint">Soldan birini seç, sağda eşini bul!</p>
    <div class="cols"><div>${L.map(([t,i])=>`<button class="tile" data-side="L" data-i="${i}">${t}</button>`).join("")}</div>
    <div>${R.map(([t,i])=>`<button class="tile" data-side="R" data-i="${i}">${t}</button>`).join("")}</div></div><div class="msg" id="msg"></div>`;
  panel.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(b.dataset.side=="L")speak(W[b.dataset.i][0]);
    if(!sel||sel.dataset.side==b.dataset.side){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
    if(sel.dataset.i==b.dataset.i){sel.classList.replace("sel","done");b.classList.add("done");left--;
      $("#msg").textContent=["Süper! 👏","Harika! 🎉","Bravo! 🔥","Efsane! ⚡"][left%4];
      if(!left){const s=miss==0?3:miss<3?2:1;addStar(s);$("#msg").innerHTML=`Hepsini buldun! +${"⭐".repeat(s)}<br><button class="btn" id="again">Tekrar oyna</button>`;$("#again").onclick=esle}}
    else{miss++;[sel,b].forEach(x=>{x.classList.remove("sel");x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),400)});$("#msg").textContent="Hmm, olmadı! Tekrar dene 🤔"}
    sel=null;
  });
}

function quiz(listen=false){
  const W=words(),Q=shuffle(W).slice(0,Math.min(8,W.length));let n=0,score=0;const s=S();
  const ask=()=>{
    if(n==Q.length){const st=score==Q.length?3:score>=Q.length*.6?2:score>0?1:0;addStar(st);
      panel.innerHTML=`<div class="end"><div class="big">${score} / ${Q.length}</div><div class="msg">${st==3?"Mükemmel! 🏆":st==2?"Çok iyi! 🎉":"Pratik yapalım, sen yaparsın! 💪"}</div><div>+${"⭐".repeat(st)||"0"}</div><button class="btn" id="again">Tekrar oyna</button></div>`;
      $("#again").onclick=()=>quiz(listen);return}
    const w=Q[n],dir=listen?"listen":(s.oneway||Math.random()<.5)?"f":"b",key=dir=="b"?0:2;
    const opts=shuffle([w,...shuffle(W.filter(x=>x!==w&&x[key]!==w[key])).slice(0,3)]);
    panel.innerHTML=`<div class="bar"><b style="width:${n/Q.length*100}%"></b></div>
      ${dir=="listen"?`<div class="ctrl" style="margin:0 0 10px"><button class="btn big-btn" id="sp">🔊 Tekrar dinle</button><button class="btn alt big-btn" id="slow">🐢 Yavaş dinle</button></div><p class="hint">Dinle! Ne dedi? İstediğin kadar tekrar dinleyebilirsin.</p>`
        :`<div class="q">${dir=="f"?w[0]:w[2]}</div><p class="hint">${dir=="f"?s.ask[0]:s.ask[1]}</p>`}
      <div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o===w}">${o[key]}</button>`).join("")}</div><div class="msg" id="msg"></div>`;
    if(dir=="listen"){$("#sp").onclick=()=>speak(w[0]);$("#slow").onclick=()=>speak(w[0],.45);setTimeout(()=>speak(w[0]),250)}
    panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      panel.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok=="true")x.classList.add("right")});
      if(b.dataset.ok=="true"){score++;$("#msg").textContent="Doğru! ✅ "+w[0]+" = "+w[2]}
      else{b.classList.add("wrong");$("#msg").textContent="Yanlış ❌ "+w[0]+" = "+w[2]}
      speak(w[0]);n++;setTimeout(ask,1600);
    });
  };ask();
}
nav();run();
</script>
